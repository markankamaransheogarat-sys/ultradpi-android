name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk UltraDPI.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UltraDPI-APK
        path: UltraDPI.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "UltraDPI Android v1.0.0"
        body: |
          ### ⚡ UltraDPI for Android (1-Button Bypass)
          - Single toggle button for 100% speed TSPU / DPI bypass.
          - Local VpnService without external VPN proxies.
          - Unblocks YouTube 4K, Discord Voice RTC, ChatGPT, Claude AI.
        files: UltraDPI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
